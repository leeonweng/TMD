<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #475569; }
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; }
      .wood { fill: #d97706; stroke: #92400e; stroke-width: 2.5; stroke-linejoin: round; }
      .wood-light { fill: #fef3c7; stroke: #b45309; stroke-width: 2; stroke-linejoin: round; }
      .wood-ghost { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 4 3; opacity: 0.65; }
      .wood-dark { fill: #b45309; stroke: #78350f; stroke-width: 2; }
      .metal { fill: #64748b; stroke: #334155; stroke-width: 2; }
      .rubber { stroke: #ef4444; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 6 3; }
      .rubber-ghost { stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 4 3; opacity: 0.5; }
      .vector-line { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 5 4; }
      .label-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4px; }
      .label-text { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .label-desc { font-size: 11px; font-weight: 500; fill: #64748b; }
      .badge-effort { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5; }
      .badge-pivot { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .badge-load { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .dim-line { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Header Area -->
  <g transform="translate(50, 45)">
    <text class="title" x="0" y="0">科技領域教材教法 · 投石戰車結構組裝完成示意圖</text>
    <text class="subtitle" x="0" y="26">工程設計：雷切卡榫組裝、車頭朝左左向拋射、三段可調仰角（45° / 60° / 75°）與槓桿三要素配置圖解</text>
  </g>

  <!-- Left Main Panel: Side Elevation Assembly View -->
  <g transform="translate(50, 95)">
    <rect width="680" height="655" class="card-bg" />
    <text x="25" y="35" style="font-size: 16px; font-weight: 800; fill: #0f172a;">一、投石戰車側面組裝全覽圖（車身朝左 · 左向發射機構）</text>
    <text x="25" y="55" style="font-size: 12px; fill: #64748b;">標註槓桿動力機構、雷切角度定位卡槽、旋轉軸心與向左拋射角度控制</text>

    <!-- Ground Level -->
    <line x1="30" y1="560" x2="650" y2="560" stroke="#94a3b8" stroke-width="2.5" />
    <text x="610" y="580" style="font-size: 11px; fill: #94a3b8; font-weight: 600;">地面基準線</text>

    <!-- Wheels (Front Wheel Left, Rear Wheel Right) -->
    <!-- Front Wheel (Left) -->
    <g transform="translate(260, 560)">
      <circle cx="0" cy="0" r="28" fill="#475569" stroke="#1e293b" stroke-width="3" />
      <circle cx="0" cy="0" r="12" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" />
      <!-- spokes -->
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#334155" stroke-width="2" />
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#334155" stroke-width="2" />
      <text x="0" y="42" text-anchor="middle" style="font-size: 10px; font-weight: 700; fill: #64748b;">前輪（車頭）</text>
    </g>
    <!-- Rear Wheel (Right) -->
    <g transform="translate(520, 560)">
      <circle cx="0" cy="0" r="28" fill="#475569" stroke="#1e293b" stroke-width="3" />
      <circle cx="0" cy="0" r="12" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" />
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#334155" stroke-width="2" />
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#334155" stroke-width="2" />
      <text x="0" y="42" text-anchor="middle" style="font-size: 10px; font-weight: 700; fill: #64748b;">後輪（車尾）</text>
    </g>

    <!-- Chassis Wooden Base (榫卯底盤) -->
    <rect x="200" y="520" width="370" height="24" class="wood" rx="4" />
    <!-- Mortise tenon joints on base -->
    <rect x="230" y="524" width="16" height="16" fill="#78350f" />
    <rect x="340" y="524" width="16" height="16" fill="#78350f" />
    <rect x="490" y="524" width="16" height="16" fill="#78350f" />

    <!-- Laser-cut Side Plate (雷切側支架：對標雷切圖檔 Part 4) -->
    <!-- Upright tower at front (LEFT), slope dropping to rear horizontal bed (RIGHT) -->
    <path d="M 220 520 
             L 550 520 
             L 550 470 
             C 450 455, 360 410, 320 330 
             C 300 290, 260 250, 220 280 
             C 195 300, 195 370, 200 450 
             L 200 520 
             Z" 
          class="wood-light" />

    <!-- Front Rubber Band Anchor Post (橡皮筋前置固定柱 - 車頭左側) -->
    <rect x="215" y="495" width="12" height="25" class="metal" rx="2" />
    <circle cx="221" cy="505" r="5" fill="#ef4444" />
    <text x="210" y="490" style="font-size: 10px; font-weight: 700; fill: #ef4444;">前動力錨柱</text>

    <!-- Axle Pivot Point (支點: 位於前方立柱下方) -->
    <g transform="translate(290, 440)">
      <circle cx="0" cy="0" r="16" class="metal" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#0f172a" />
    </g>

    <!-- Angle Notches on the Upright Tower (朝向左上方 75° / 60° / 45°) -->
    <!-- Radius from pivot (290, 440) = 135px -->
    <!-- 75 deg slot: dx = -135*cos(75°) = -34.9, dy = -135*sin(75°) = -130.4 -> (255.1, 309.6) -->
    <line x1="260" y1="325" x2="250" y2="295" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
    <text x="240" y="285" style="font-size: 11px; font-weight: 700; fill: #b45309;">75° 限位槽</text>

    <!-- 60 deg slot: dx = -135*cos(60°) = -67.5, dy = -135*sin(60°) = -116.9 -> (222.5, 323.1) -->
    <line x1="235" y1="335" x2="215" y2="310" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
    <text x="175" y="305" style="font-size: 11px; font-weight: 700; fill: #b45309;">60° 限位槽</text>

    <!-- 45 deg slot: dx = -135*cos(45°) = -95.5, dy = -135*sin(45°) = -95.5 -> (194.5, 344.5) -->
    <line x1="210" y1="360" x2="185" y2="335" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
    <text x="105" y="340" style="font-size: 11px; font-weight: 800; fill: #2563eb;">45° 限位卡槽（最佳射程）</text>

    <!-- Active Stopper Bar Pin (止擋木桿插銷) inserted in 45° slot -->
    <circle cx="195" cy="345" r="9" class="metal" />
    <circle cx="195" cy="345" r="3" fill="#ffffff" />
    <text x="195" y="365" text-anchor="middle" style="font-size: 10px; font-weight: 700; fill: #1e3a8a;">止擋橫桿</text>

    <!-- Ghosted Cocked Arm (待發狀態: 擺臂臥於後方車斗 0° 待發，高張力蓄能) -->
    <g transform="translate(290, 440) rotate(5)">
      <rect x="0" y="-8" width="230" height="16" class="wood-ghost" rx="3" />
      <circle cx="215" cy="0" r="16" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3" />
      <circle cx="215" cy="0" r="8" fill="#e2e8f0" opacity="0.6" />
      <text x="160" y="24" style="font-size: 10px; font-weight: 600; fill: #94a3b8;">（待發位置：臥於後方車斗）</text>
    </g>
    <!-- Stretched rubber band when cocked (ghosted) -->
    <path d="M 221 505 Q 260 520 370 445" fill="none" class="rubber-ghost" />

    <!-- Active Catapult Throwing Arm (揚起至 45° 撞擊止擋位置，向左上方發射) -->
    <!-- Arm extends from pivot (290, 440) at angle 135° (pointing UP-LEFT) -->
    <g transform="translate(290, 440) rotate(-135)">
      <!-- Main throwing lever -->
      <rect x="0" y="-10" width="225" height="20" class="wood" rx="4" />
      <!-- Effort tie-point hole (施力孔) -->
      <circle cx="45" cy="0" r="5" class="metal" />
      <circle cx="45" cy="0" r="2" fill="#ffffff" />
      <!-- Payload Basket / Cup at tip -->
      <path d="M 210 -12 L 245 -12 C 255 -12 260 -2 260 12 L 210 12 Z" fill="#92400e" stroke="#78350f" stroke-width="2" />
      <!-- Projectile (乒乓球) seated in basket -->
      <circle cx="230" cy="-18" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
      <text x="230" y="-14" text-anchor="middle" style="font-size: 9px; font-weight: 800; fill: #0284c7;">拋射物</text>
    </g>

    <!-- Elastic Rubber Band in Active Launch State (連至施力孔) -->
    <!-- Effort hole is at dx = 45*cos(135°) = -31.8, dy = -45*sin(135°) = -31.8 -> (258.2, 408.2) -->
    <path d="M 221 505 Q 235 460 258 408" fill="none" class="rubber" />
    <line x1="242" y1="470" x2="230" y2="495" stroke="#ef4444" stroke-width="2" marker-end="url(#red-arrow)" />
    <text x="175" y="475" style="font-size: 11px; font-weight: 700; fill: #ef4444;">彈力拉緊方向</text>

    <!-- Launch Trajectory Vector V0 (45° 仰角向左前方發射) -->
    <!-- Basket release position: dx = 230*cos(135°) = -162.6, dy = -230*sin(135°) = -162.6 -> (127.4, 277.4) -->
    <!-- Ball center: (115, 265) -->
    <line x1="115" y1="265" x2="25" y2="175" class="vector-line" marker-end="url(#arrow)" />
    <text x="20" y="160" style="font-size: 13px; font-weight: 800; fill: #2563eb;">初速度向量 V₀ (45° 仰角向左)</text>
    
    <!-- 45 deg angle arc -->
    <line x1="115" y1="265" x2="35" y2="265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M 75 265 A 40 40 0 0 1 87 237" fill="none" stroke="#2563eb" stroke-width="2" />
    <text x="65" y="250" style="font-size: 12px; font-weight: 800; fill: #2563eb;">45°</text>

    <!-- Arm Swing Direction Arc (揮臂運動軌跡：由後向前逆時針高速甩臂) -->
    <path d="M 440 420 A 180 180 0 0 0 170 300" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" />
    <text x="330" y="360" style="font-size: 11px; font-weight: 700; fill: #d97706;">甩臂旋轉軌跡（由後向前逆時針）</text>

    <!-- Leverage Elements Callout Badges -->
    <!-- 1. 支點 Pivot Callout -->
    <g transform="translate(340, 450)">
      <rect width="115" height="48" class="badge-pivot" rx="6" />
      <text x="10" y="20" class="label-text" style="fill: #0369a1;">● 支點 (Pivot)</text>
      <text x="10" y="38" class="label-desc" style="fill: #0c4a6e;">低摩擦力旋轉金屬軸</text>
      <line x1="0" y1="24" x2="-35" y2="-5" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
    </g>

    <!-- 2. 施力點 Effort Callout -->
    <g transform="translate(270, 340)">
      <rect width="115" height="48" class="badge-effort" rx="6" />
      <text x="10" y="20" class="label-text" style="fill: #b91c1c;">● 施力點 (Effort)</text>
      <text x="10" y="38" class="label-desc" style="fill: #7f1d1d;">橡皮筋彈性位能掛孔</text>
      <line x1="0" y1="35" x2="-10" y2="55" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>

    <!-- 3. 負載點 Load Callout -->
    <g transform="translate(40, 80)">
      <rect width="115" height="48" class="badge-load" rx="6" />
      <text x="10" y="20" class="label-text" style="fill: #15803d;">● 負載點 (Load)</text>
      <text x="10" y="38" class="label-desc" style="fill: #14532d;">拋射籃與投射彈丸</text>
      <line x1="60" y1="48" x2="105" y2="245" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>
  </g>

  <!-- Right Side Panel: Exploded Interlock & Laser Cut Specs -->
  <g transform="translate(755, 95)">
    <!-- Sub-card 1: Interlocking & Tenon Mortise Specs -->
    <rect width="395" height="315" class="card-bg" />
    <text x="20" y="32" style="font-size: 15px; font-weight: 800; fill: #0f172a;">二、榫卯卡榫與組裝工法重點</text>
    <text x="20" y="50" style="font-size: 12px; fill: #64748b;">木工安全與高精度雷射切割特徵</text>

    <!-- Mini diagram of mortise & tenon joinery -->
    <g transform="translate(25, 75)">
      <!-- Tenon joint illustration -->
      <rect x="0" y="0" width="100" height="40" class="wood-light" rx="3" />
      <rect x="100" y="8" width="20" height="24" class="wood" />
      <text x="135" y="25" style="font-size: 12px; font-weight: 700; fill: #1e293b;">側板凸榫 (Tenon)</text>
      
      <rect x="0" y="55" width="120" height="30" class="wood" rx="3" />
      <rect x="40" y="55" width="20" height="15" fill="#f8fafc" stroke="#92400e" stroke-width="1.5" />
      <text x="135" y="75" style="font-size: 12px; font-weight: 700; fill: #1e293b;">底盤凹槽 (Mortise)</text>
    </g>

    <g transform="translate(20, 185)" style="font-size: 12.5px; fill: #334155; line-height: 1.6;">
      <text x="0" y="0">✔ <tspan font-weight="700">精準卡榫固定</tspan>：木板公差密合，無需螺絲即可穩固。</text>
      <text x="0" y="24">✔ <tspan font-weight="700">三段角度限位槽</tspan>：前方立柱插銷切換 45°、60°、75°。</text>
      <text x="0" y="48">✔ <tspan font-weight="700">逆時針甩臂衝程</tspan>：車斗後方平躺待發，向前上方發射。</text>
      <text x="0" y="72">✔ <tspan font-weight="700">組裝安全檢核</tspan>：旋轉軸心水平無卡阻，左前方發射區嚴禁站人。</text>
    </g>

    <!-- Sub-card 2: Package & Download Info -->
    <g transform="translate(0, 335)">
      <rect width="395" height="320" class="card-bg" />
      <text x="20" y="32" style="font-size: 15px; font-weight: 800; fill: #0f172a;">三、雷射切割零件清單（BOM 表）</text>
      <text x="20" y="50" style="font-size: 12px; fill: #64748b;">3mm 椴木層積板雷切配置規格</text>

      <!-- Part 1: Side Plates -->
      <g transform="translate(20, 75)">
        <circle cx="12" cy="12" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <text x="12" y="16" text-anchor="middle" style="font-size: 11px; font-weight: 700; fill: #0369a1;">1</text>
        <text x="32" y="16" style="font-size: 13px; font-weight: 700; fill: #0f172a;">多角度限位側板 × 2 片（Part 4）</text>
        <text x="32" y="34" style="font-size: 11.5px; fill: #64748b;">尺寸 240×140mm，含 3 段止擋卡槽與軸孔，朝左配置</text>
      </g>

      <!-- Part 2: Throwing Arm -->
      <g transform="translate(20, 130)">
        <circle cx="12" cy="12" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <text x="12" y="16" text-anchor="middle" style="font-size: 11px; font-weight: 700; fill: #0369a1;">2</text>
        <text x="32" y="16" style="font-size: 13px; font-weight: 700; fill: #0f172a;">高強度投石主臂 × 1 支（Part 8）</text>
        <text x="32" y="34" style="font-size: 11.5px; fill: #64748b;">長度 280mm，一體成型圓形彈射籃與施力孔</text>
      </g>

      <!-- Part 3: Chassis Beams -->
      <g transform="translate(20, 185)">
        <circle cx="12" cy="12" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <text x="12" y="16" text-anchor="middle" style="font-size: 11px; font-weight: 700; fill: #0369a1;">3</text>
        <text x="32" y="16" style="font-size: 13px; font-weight: 700; fill: #0f172a;">矩形底盤定位橫樑 × 3 組</text>
        <text x="32" y="34" style="font-size: 11.5px; fill: #64748b;">雙向精密凹凸卡榫，固定兩側板跨距寬度</text>
      </g>

      <!-- Part 4: Stopper Pin & Hardware -->
      <g transform="translate(20, 240)">
        <circle cx="12" cy="12" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <text x="12" y="16" text-anchor="middle" style="font-size: 11px; font-weight: 700; fill: #0369a1;">4</text>
        <text x="32" y="16" style="font-size: 13px; font-weight: 700; fill: #0f172a;">旋轉木軸棒 + 限位插銷組</text>
        <text x="32" y="34" style="font-size: 11.5px; fill: #64748b;">直徑 6mm 實心圓棒，搭配止滑膠圈與橡皮筋</text>
      </g>
    </g>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(50, 775)">
    <text style="font-size: 11px; fill: #94a3b8;">國立臺北教育大學 · 115學年度第一學期科技領域教材教法課程成果 · 設計製作：張宗智、吳立安、黃勁允、翁苙維 · 指導老師：顏榮泉老師</text>
  </g>
</svg>
